<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#262038"/>
      <stop offset="100%" stop-color="#15121E"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332A52"/>
      <stop offset="100%" stop-color="#251E3D"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (keeps maskable icons safe on Android) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- d20 outline: hexagonal silhouette -->
  <polygon points="256,71 416,164 416,349 256,441 96,349 96,164"
           fill="#201A30" stroke="#D4AF37" stroke-width="16"
           stroke-linejoin="round"/>

  <!-- Central face -->
  <polygon points="96,164 416,164 256,441"
           fill="url(#face)" stroke="#D4AF37" stroke-width="10"
           stroke-linejoin="round"/>

  <!-- 20 -->
  <text x="256" y="278" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="118" fill="#D4AF37">20</text>
</svg>
